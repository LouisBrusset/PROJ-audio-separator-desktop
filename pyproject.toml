[project]
name = "PROJ-audio-separator-desktop"
version = "0.1.0"
description = "Petite application graphique pour séparer voix et instrumentale avec audio-separator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "audio-separator[gpu]>=0.47",
    "audioread>=3.0",
    "torch>=2.7",
    "torchvision",
    "PySide6-Essentials>=6.8",
]

# gui-scripts : identique à scripts sous Linux, mais sans fenêtre console sous Windows
[project.gui-scripts]
PROJ-audio-separator-desktop = "separator_gui.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["separator_gui"]

[tool.uv]
# On ne résout que pour Linux et Windows (pas de wheels CUDA sur macOS)
environments = ["sys_platform == 'linux'", "sys_platform == 'win32'"]

# PyTorch compilé avec CUDA 12.8, nécessaire pour les GPU Blackwell (RTX 50xx)
[tool.uv.sources]
torch = [{ index = "pytorch-cu128" }]
torchvision = [{ index = "pytorch-cu128" }]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
